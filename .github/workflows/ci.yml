name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Every job below does checkout + toolchain only, then hands off to
# scripts/ci.py, which owns build dirs, configure flags, sanitizer options
# and the coverage gate - and can be run locally the same way.
# ninja is preinstalled on the runner image; meson and gcovr come from pip
# (faster than apt); zlib and the Python headers have to come from apt.

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [default, asan, coverage]
    name: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev python3-dev
          pip install --disable-pip-version-check meson gcovr pytest

      - run: python3 scripts/ci.py ${{ matrix.lane }}

  python-bindings:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mirrors PYTHONS in scripts/ci.py; GitHub needs the matrix spelled
        # out statically to fan the jobs out.
        python-version: ["3.10", "3.14"]
    name: python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      # The one thing the script can't do itself: install an interpreter that
      # isn't on the runner. ci.py then finds it by version.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev
          pip install --disable-pip-version-check meson pytest

      - run: python3 scripts/ci.py python:${{ matrix.python-version }}

  parquet-example:
    runs-on: ubuntu-latest
    name: parquet
    steps:
      - uses: actions/checkout@v4

      # This job is the one place pyarrow is installed, and ci.py's parquet
      # lane fails rather than skips if it is missing - so the example is
      # either verified against a real writer or the build is red.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev python3-dev
          pip install --disable-pip-version-check meson pyarrow numpy pytest

      - run: python3 scripts/ci.py parquet
