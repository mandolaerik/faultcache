name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            build_dir: build
            setup_args: ""
          - name: asan
            build_dir: build-asan
            setup_args: "-Db_sanitize=address,undefined"
    name: ${{ matrix.name }}
    env:
      # abort_on_error=1: some tests deliberately trigger a real SIGSEGV and
      # assert the process dies via signal (WIFSIGNALED); ASan's default of
      # exiting normally after reporting would fail that check.
      ASAN_OPTIONS: detect_leaks=1,abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1,halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build zlib1g-dev

      - name: meson setup
        run: meson setup ${{ matrix.build_dir }} ${{ matrix.setup_args }}

      - name: Build
        run: ninja -C ${{ matrix.build_dir }}

      - name: Test
        run: meson test -C ${{ matrix.build_dir }} --print-errorlogs

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build zlib1g-dev gcovr

      - name: meson setup
        run: meson setup build-coverage -Db_coverage=true

      - name: Build
        run: ninja -C build-coverage

      - name: Test
        run: meson test -C build-coverage --print-errorlogs

      # src/ is gated at 100% line coverage; genuinely untestable/deprioritized
      # lines are marked GCOVR_EXCL. examples/ and test/ aren't held to the
      # same bar, so they're excluded from this gate.
      - name: Coverage (src/ must be 100% line coverage)
        run: gcovr --root . --filter 'src/.*\.c$' --fail-under-line 100 --print-summary build-coverage
